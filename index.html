<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Observatorio</title><style>body{font:15px system-ui;background:#15171b;color:#eee;margin:18px}header{display:flex;justify-content:space-between}h1{font-size:23px}nav{display:flex;gap:7px;overflow:auto;margin:15px 0}button{background:#292e36;color:white;border:1px solid #545b65;border-radius:22px;padding:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}a{color:inherit;text-decoration:none;background:#22252b;border-radius:12px;overflow:hidden}img{width:100%;height:155px;object-fit:cover}.body{padding:12px}h2{font-size:16px;margin:5px 0}p{font-size:13px;color:#c0c7d0}.muted{font-size:11px;color:#aab4c0}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}img{height:100px}h2{font-size:13px}.body{padding:9px}}</style><header><h1>📰 El Observatorio</h1><span id="state">Noticias</span></header><nav id="nav"></nav><main class="grid" id="grid"></main><script>
const cats={'Últimas noticias':'Últimas noticias','Portada':'','Mundo':'WORLD','Economía':'BUSINESS','Tecnología':'TECHNOLOGY','Ciencia':'SCIENCE','Salud':'HEALTH','BBC News Mundo':'BBC News Mundo','La Vanguardia':'La Vanguardia','elDiario.es':'elDiario.es','Cadena SER':'Cadena SER','EL PAÍS':'EL PAÍS','The New York Times':'The New York Times'};let section='Últimas noticias';
const newsUrl=()=>section==='Portada'?'https://news.google.com/rss?hl=es&gl=ES&ceid=ES:es':'https://news.google.com/rss/headlines/section/topic/'+cats[section]+'?hl=es&gl=ES&ceid=ES:es';
const clean=s=>{let e=document.createElement('div');e.innerHTML=s||'';return e.textContent||''};
async function load(){document.getElementById('state').textContent='Actualizando…';try{const response=await fetch(new URL('news.json',location.href).href+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Data unavailable');const data=await response.json();const stories=data.categories?.[section]||[];const grid=document.getElementById('grid');grid.replaceChildren();for(const item of stories){if(!item.url?.startsWith('https://'))continue;const card=document.createElement('a');card.href=item.url;card.target='_blank';card.rel='noopener noreferrer';const photo=document.createElement('img');photo.src=item.image?.startsWith('https://')?item.image:'./fallback.svg';photo.loading='lazy';photo.alt='Imagen de la noticia';photo.onerror=()=>{photo.onerror=null;photo.src='./fallback.svg'};card.append(photo);const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='muted';meta.textContent=item.source||'Google News';const heading=document.createElement('h2');heading.textContent=item.title;const summary=document.createElement('p');summary.textContent=(item.description||'').replace(item.title,'').trim().slice(0,260)||'Abrir noticia';body.append(meta,heading,summary);card.append(body);grid.append(card)}document.getElementById('state').textContent='Noticias: '+(stories.length)+' · '+new Date(data.updated).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('state').textContent='Actualizando fuentes…';document.getElementById('grid').textContent='El feed se publicará después de la primera ejecución de GitHub Actions.';console.warn(e)}}
for(let name of Object.keys(cats)){let b=document.createElement('button');b.textContent=name;b.onclick=()=>{section=name;load()};document.getElementById('nav').append(b)}load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></html>
