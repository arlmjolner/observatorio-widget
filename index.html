<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101216"><title>El Observatorio · Noticias</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#1a1d23;--line:#30343c;--txt:#f0eee9;--muted:#9da4ae;--accent:#c6ac81;--soft:#242830;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{max-width:1440px;margin:auto;padding:0 26px}.top{border-bottom:1px solid var(--line);background:#13161a}.mast{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #665941;color:var(--accent);border-radius:11px;font-family:Georgia,serif;font-size:27px}.brand h1{font:normal 30px/1 Georgia,Times New Roman,serif;letter-spacing:-.9px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.35px;margin-top:8px;text-transform:uppercase}.actions{display:flex;align-items:center;gap:10px}.pill{font-size:12px;border:1px solid #455045;color:#b3d2b7;padding:7px 10px;border-radius:50px;white-space:nowrap}.dot{display:inline-block;background:#79be88;width:6px;height:6px;border-radius:50%;margin-right:6px}.control{background:var(--soft);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px}.control:hover{border-color:#757b85}.search{width:min(300px,28vw);background:#22262d;color:var(--txt);border:1px solid #3b3f48;border-radius:9px;padding:10px 12px;outline:none}.nav-wrap{border-bottom:1px solid var(--line);position:sticky;top:0;background:#13161bf5;backdrop-filter:blur(14px);z-index:10}.nav{display:flex;gap:3px;overflow:auto;scrollbar-width:none;padding:10px 0}.nav::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;color:#abb1bc;padding:9px 13px;border-radius:7px;white-space:nowrap;font-size:13px}.tab:hover{background:#272c34;color:white}.tab[aria-current=true]{background:#393325;color:#e6d3aa}.main{padding-top:30px;padding-bottom:80px}.eyebrow{display:flex;align-items:center;gap:11px;color:var(--accent);font-size:11px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.eyebrow:after{content:"";height:1px;background:var(--line);flex:1}.headline{margin:12px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.headline h2{font:normal clamp(31px,4.4vw,52px)/1.05 Georgia,serif;letter-spacing:-1.5px;margin:0}.updated{font-size:12px;color:var(--muted);white-space:nowrap}.feature{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin:24px 0 31px}.feature a{position:relative;min-height:340px;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#242832}.cover{width:100%;height:100%;object-fit:cover;display:block}.feature .cover{position:absolute;inset:0}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 5%,#0d1118e8 100%)}.feature .feature-info{position:absolute;bottom:0;padding:25px;width:100%}.kicker{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#e8c995;font-weight:800}.feature h3{font:normal clamp(23px,2.5vw,36px)/1.17 Georgia,serif;margin:9px 0}.feature .side h3{font-size:24px}.feature .side{min-height:340px}.feature .teaser{color:#e0e1e3;font-size:13px;line-height:1.5;max-width:680px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px;border-bottom:1px solid var(--line);padding-bottom:16px}.sectionbar h3{font:normal 24px Georgia,serif;margin:0}.tools{display:flex;align-items:center;gap:8px}.counter{font-size:12px;color:var(--muted)}select.control{max-width:160px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 17px}.story{min-width:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel);transition:transform .18s,border-color .18s}.story:hover,.feature a:hover{transform:translateY(-3px);border-color:#75684e}.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#252a33}.card-body{padding:15px 15px 18px;display:flex;flex-direction:column;gap:10px;flex:1}.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--muted);font-size:11px}.source{color:var(--accent);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.story h4{font:normal 18px/1.27 Georgia,serif;letter-spacing:-.2px;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.summary{color:#b1b6c0;font-size:12px;line-height:1.56;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.more{display:block;margin:25px auto 0;background:transparent;color:var(--txt);border:1px solid #59616f;border-radius:9px;padding:12px 25px}.more:hover{background:var(--soft)}.empty{border:1px dashed var(--line);padding:44px;text-align:center;color:var(--muted);border-radius:14px;line-height:1.8}.empty strong{color:var(--txt)}footer{font-size:12px;color:#858d99;border-top:1px solid var(--line);padding:22px 0 35px}.footer-flex{display:flex;justify-content:space-between;gap:10px}.mobile-search{display:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.shell{padding:0 15px}.mast{min-height:77px}.brand h1{font-size:23px}.brand small{font-size:9px;letter-spacing:.8px}.mark{width:36px;height:36px;font-size:23px}.actions .search{display:none}.pill{font-size:10px}.mobile-search{display:block;margin-top:17px}.mobile-search input{width:100%;max-width:none}.main{padding-top:19px}.headline{align-items:start}.headline h2{font-size:34px}.updated{font-size:10px;white-space:normal;text-align:right;max-width:95px}.feature{grid-template-columns:1fr;gap:10px;margin-top:18px}.feature a{min-height:280px}.feature .side{min-height:190px}.feature .side h3{font-size:24px}.feature-info{padding:20px!important}.feature h3{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card-body{padding:11px}.story h4{font-size:15px}.summary{font-size:11px;-webkit-line-clamp:2}.sectionbar h3{font-size:20px}.sectionbar{align-items:start}.tools{flex-wrap:wrap;justify-content:flex-end}.tools select{max-width:110px;font-size:11px;padding:8px}.nav{padding:8px 0}.tab{padding:9px 11px}}@media(max-width:365px){.grid{grid-template-columns:1fr}.feature a{min-height:260px}.pill{display:none}}
[hidden]{display:none!important}
/* iPhone 16e: 390 CSS px portrait, 844 CSS px tall; also supports Notion's narrower embeds. */
html{-webkit-text-size-adjust:100%}body{min-width:0;overflow-x:clip}img{max-width:100%}button,input,select{touch-action:manipulation}
@media(max-width:600px){
 .shell{width:100%;max-width:100%;padding-inline:16px}
 .mast{min-height:72px;gap:8px}.brand{min-width:0;gap:9px}.brand h1{font-size:22px;white-space:nowrap}.brand small{font-size:9px;letter-spacing:.55px}.mark{flex:0 0 34px;width:34px;height:34px}.actions{flex-shrink:0;gap:6px}.pill{display:none}.actions .control{height:44px;min-width:44px;padding:9px}
 .nav-wrap{top:0}.nav{gap:4px;padding-block:7px;scroll-padding-inline:16px;-webkit-overflow-scrolling:touch}.tab{min-height:44px;display:flex;align-items:center;font-size:13px;padding-inline:13px}
 .main{padding-top:20px;padding-bottom:44px}.eyebrow{font-size:10px;letter-spacing:1.4px}
 .headline{display:block;margin:11px 0 13px}.headline h2{font-size:35px;letter-spacing:-1px;overflow-wrap:anywhere}.updated{display:block;max-width:none;text-align:left;margin-top:8px;font-size:11px}
 .mobile-search{margin:12px 0 16px}.mobile-search input{height:46px;padding:11px 14px;font-size:16px}
 .feature{display:flex;flex-direction:column;margin:0 0 25px;gap:12px}.feature a{width:100%;min-height:0;aspect-ratio:1.24;border-radius:13px}.feature a.side{aspect-ratio:1.75}.feature .feature-info{padding:16px!important}.feature h3{font-size:25px;line-height:1.15}.feature .side h3{font-size:20px}.feature .teaser{font-size:12px;-webkit-line-clamp:2}
 .sectionbar{flex-wrap:wrap;gap:12px;margin-bottom:14px}.sectionbar h3{font-size:23px}.tools{width:100%;justify-content:space-between}.tools select.control{max-width:none;min-height:44px;font-size:13px;padding:8px 12px}.counter{font-size:12px}
 .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.story{border-radius:13px}.story .thumb{aspect-ratio:16/9;height:auto}.story .card-body{gap:10px;padding:16px}.story h4{font-size:21px;line-height:1.26;-webkit-line-clamp:4}.story .summary{font-size:13px;line-height:1.5;-webkit-line-clamp:3}.meta{font-size:12px}
 .more{min-height:46px;width:100%}.footer-flex{flex-direction:column;line-height:1.5}
}
@media(max-width:350px){.brand h1{font-size:19px}.shell{padding-inline:12px}.feature h3{font-size:22px}.headline h2{font-size:31px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.story,.feature a{transition:none}}
</style></head>
<body><header class="top"><div class="shell mast"><a class="brand" href="./" aria-label="Volver a portada"><span class="mark">O</span><span><h1>El Observatorio</h1><small>Una mirada al mundo</small></span></a><div class="actions"><span class="pill"><span class="dot"></span>ACTUALIZACIÓN AUTOMÁTICA</span><input class="search" id="search" placeholder="Buscar noticias…" aria-label="Buscar noticias"><button class="control" id="refresh" title="Consultar novedades" aria-label="Actualizar noticias">↻</button></div></div></header>
<div class="nav-wrap"><nav class="shell nav" id="tabs" aria-label="Secciones"></nav></div>
<main class="shell main"><div class="eyebrow" id="tagline">ACTUALIDAD EN DIRECTO</div><div class="headline"><h2 id="sectionTitle">Últimas noticias</h2><span class="updated" id="updated">Cargando fuentes…</span></div><div class="mobile-search"><input class="search" id="mobileSearch" placeholder="Buscar noticias…" aria-label="Buscar noticias"></div><div class="feature" id="features"></div><section><div class="sectionbar"><h3 id="listingTitle">Todas las noticias</h3><div class="tools"><span class="counter" id="count"></span><select class="control" id="order" aria-label="Ordenar noticias"><option value="recent">Más recientes</option><option value="oldest">Más antiguas</option><option value="source">Por medio</option></select></div></div><div class="grid" id="grid" aria-live="polite"></div><button class="more" id="more" hidden>Mostrar más noticias ↓</button></section></main>
<footer><div class="shell footer-flex"><span>© El Observatorio · Fuentes originales enlazadas</span><span>Actualización de feeds programada cada 5 minutos*</span></div></footer>
<script>
const SECTIONS=['Últimas noticias','Portada','Mundo','Economía','Tecnología','Ciencia','Salud','BBC News Mundo','La Vanguardia','elDiario.es','Cadena SER','EL PAÍS','The New York Times'];
const $=id=>document.getElementById(id),fallback='./fallback.svg';let selected='Últimas noticias',data=null,search='',sort='recent',visible=16;
function cleanTime(x){const t=Date.parse(x||'');return Number.isFinite(t)?t:0}
function timeLabel(x){const t=cleanTime(x);if(!t)return '';return new Date(t).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function safeLink(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:'#'}catch{return '#'}}
function img(el,src){el.src=src?.startsWith('https://')?src:fallback;el.loading='lazy';el.referrerPolicy='no-referrer';el.onerror=()=>{el.onerror=null;el.src=fallback}}
function storyCard(a){const link=document.createElement('a');link.className='story';link.href=safeLink(a.url);link.target='_blank';link.rel='noopener noreferrer';const picture=document.createElement('img');picture.className='thumb';picture.alt='';img(picture,a.image);const body=document.createElement('div');body.className='card-body';const meta=document.createElement('div');meta.className='meta';const source=document.createElement('span');source.className='source';source.textContent=a.source||'Noticias';const date=document.createElement('time');date.textContent=timeLabel(a.date);meta.append(source,date);const title=document.createElement('h4');title.textContent=a.title||'Abrir noticia';const summary=document.createElement('p');summary.className='summary';summary.textContent=(a.description||'').trim()||'Consulta la información completa en el medio original.';body.append(meta,title,summary);link.append(picture,body);return link}
function heroCard(a,secondary){const link=document.createElement('a');link.className=secondary?'side':'lead';link.href=safeLink(a.url);link.target='_blank';link.rel='noopener noreferrer';const picture=document.createElement('img');picture.className='cover';picture.alt='';img(picture,a.image);const shade=document.createElement('div');shade.className='shade';const content=document.createElement('div');content.className='feature-info';const kicker=document.createElement('span');kicker.className='kicker';kicker.textContent=a.source||'Actualidad';const title=document.createElement('h3');title.textContent=a.title;content.append(kicker,title);if(!secondary){const description=document.createElement('p');description.className='teaser';description.textContent=a.description||'';content.append(description)}link.append(picture,shade,content);return link}
function filtered(){let items=[...(data?.categories?.[selected]||[])];if(search){const q=search.toLocaleLowerCase('es');items=items.filter(a=>(a.title+' '+a.description+' '+a.source).toLocaleLowerCase('es').includes(q))}if(sort==='source')items.sort((a,b)=>(a.source||'').localeCompare(b.source||''));else items.sort((a,b)=>(sort==='oldest'?1:-1)*(cleanTime(a.date)-cleanTime(b.date)));return items}
function render(){const items=filtered(),isSearch=!!search;const features=$('features'),grid=$('grid');features.replaceChildren();grid.replaceChildren();$('sectionTitle').textContent=isSearch?'Resultados de búsqueda':selected;$('tagline').textContent=isSearch?'EXPLORAR NOTICIAS':selected==='Últimas noticias'?'GOOGLE NEWS + MEDIOS SELECCIONADOS':'EL OBSERVATORIO · SECCIÓN';$('listingTitle').textContent=isSearch?'Coincidencias':'Todas las noticias';$('count').textContent=items.length+' artículos';const featured=!isSearch&&sort==='recent'&&items.length>1;if(featured){features.append(heroCard(items[0],false),heroCard(items[1],true))}features.hidden=!featured;const start=featured?2:0;const shown=items.slice(start,start+visible);if(!shown.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>No hay noticias para mostrar.</strong><div>Prueba con otra categoría o búsqueda.</div>';grid.append(empty)}else for(const item of shown)grid.append(storyCard(item));$('more').hidden=start+visible>=items.length;for(const b of $('tabs').children)b.setAttribute('aria-current',String(b.dataset.category===selected))}
async function load(){const refresh=$('refresh');refresh.disabled=true;refresh.textContent='◌';try{const url=new URL('news.json',location.href);url.searchParams.set('t',Date.now());const r=await fetch(url.href,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const next=await r.json();if(!next.categories)throw Error('Invalid feed');data=next;$('updated').textContent='Actualizado '+new Date(next.updated).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});render()}catch(e){$('updated').textContent='No se pudo actualizar';if(!data){$('grid').innerHTML='<div class="empty">No se han podido cargar las noticias. Comprueba la publicación de news.json y pulsa actualizar.</div>'}console.error('News feed',e)}finally{refresh.disabled=false;refresh.textContent='↻'}}
for(const category of SECTIONS){const b=document.createElement('button');b.className='tab';b.textContent=category;b.dataset.category=category;b.setAttribute('aria-current',String(selected===category));b.onclick=()=>{selected=category;search='';$('search').value='';$('mobileSearch').value='';visible=16;render();window.scrollTo({top:0,behavior:'smooth'})};$('tabs').append(b)}
for(const id of ['search','mobileSearch'])$(id).addEventListener('input',e=>{search=e.target.value.trim();const other=id==='search'?'mobileSearch':'search';$(other).value=e.target.value;visible=16;render()});
$('order').onchange=e=>{sort=e.target.value;render()};$('more').onclick=()=>{visible+=16;render()};$('refresh').onclick=load;
load();setInterval(()=>{if(!document.hidden)load()},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
