name: Fetch Google News
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_news.py'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '2/5 * * * *'
permissions:
  contents: write
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_news.py
      - name: Update website data
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add news.json
            git commit -m "Update latest news"
            git push
          fi
