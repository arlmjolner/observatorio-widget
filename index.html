<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Observatorio</title><style>body{font:15px system-ui;background:#15171b;color:#eee;margin:18px}header{display:flex;justify-content:space-between}h1{font-size:23px}nav{display:flex;gap:7px;overflow:auto;margin:15px 0}button{background:#292e36;color:white;border:1px solid #545b65;border-radius:22px;padding:9px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}a{color:inherit;text-decoration:none;background:#22252b;border-radius:12px;overflow:hidden}img{width:100%;height:155px;object-fit:cover}.body{padding:12px}h2{font-size:16px;margin:5px 0}p{font-size:13px;color:#c0c7d0}.muted{font-size:11px;color:#aab4c0}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}img{height:100px}h2{font-size:13px}.body{padding:9px}}</style><header><h1>📰 El Observatorio</h1><span id="state">Noticias</span></header><nav id="nav"></nav><main class="grid" id="grid"></main><script>
const cats={Portada:'',Mundo:'WORLD',Economía:'BUSINESS',Tecnología:'TECHNOLOGY',Ciencia:'SCIENCE',Salud:'HEALTH'};let section='Portada';
const newsUrl=()=>section==='Portada'?'https://news.google.com/rss?hl=es&gl=ES&ceid=ES:es':'https://news.google.com/rss/headlines/section/topic/'+cats[section]+'?hl=es&gl=ES&ceid=ES:es';
const clean=s=>{let e=document.createElement('div');e.innerHTML=s||'';return e.textContent||''};
async function load(){document.getElementById('state').textContent='Actualizando…';try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(newsUrl()),{cache:'no-store'});if(!r.ok)throw Error('RSS unavailable');let xml=new DOMParser().parseFromString(await r.text(),'text/xml');let stories=[...xml.querySelectorAll('item')].slice(0,30);let grid=document.getElementById('grid');grid.replaceChildren();for(let n of stories){let text=t=>n.querySelector(t)?.textContent||'';let link=text('link');if(!link.startsWith('https://'))continue;let title=clean(text('title'));let desc=clean(text('description')).slice(0,250);let image=n.querySelector('enclosure')?.getAttribute('url')||[...n.children].find(x=>x.localName==='content'||x.localName==='thumbnail')?.getAttribute('url');let card=document.createElement('a');card.href=link;card.target='_blank';card.rel='noopener noreferrer';if(image&&image.startsWith('https://')){let photo=document.createElement('img');photo.src=image;photo.loading='lazy';card.append(photo)}let body=document.createElement('div');body.className='body';let meta=document.createElement('div');meta.className='muted';meta.textContent=n.querySelector('source')?.textContent||'Google News';let heading=document.createElement('h2');heading.textContent=title;let summary=document.createElement('p');summary.textContent=desc.replace(title,'').trim()||'Abrir noticia';body.append(meta,heading,summary);card.append(body);grid.append(card)}document.getElementById('state').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('state').textContent='Feed no disponible';}}
for(let name of Object.keys(cats)){let b=document.createElement('button');b.textContent=name;b.onclick=()=>{section=name;load()};document.getElementById('nav').append(b)}load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></html>
