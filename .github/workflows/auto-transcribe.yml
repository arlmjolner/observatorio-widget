name: Automatically transcribe licensed article audio
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audio_sources.json'
      - 'scripts/auto_transcribe.py'
      - '.github/workflows/auto-transcribe.yml'
permissions:
  contents: write
concurrency:
  group: automatic-audio-publishing
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech recognition
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper==1.2.1
      - name: Process licensed audio
        run: python scripts/auto_transcribe.py
      - name: Publish generated transcripts
        run: |
          if [ -n "$(git status --porcelain transcripts/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add transcripts/
            git commit -m "Publish newly generated licensed transcripts"
            git pull --rebase origin main
            git push
          fi
