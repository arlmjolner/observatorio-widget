name: Transcribe authorized audio
on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "Original article URL (https://...)"
        required: true
        type: string
      audio_url:
        description: "Direct HTTPS audio URL with reuse permission"
        required: true
        type: string
      title:
        description: "Title for the transcript page"
        required: true
        type: string
      rights_confirmed:
        description: "I have permission to download, transcribe and republish this audio"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-authorized-audio
  cancel-in-progress: false
jobs:
  transcribe:
    if: ${{ inputs.rights_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transcription dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install faster-whisper==1.2.1
      - name: Download and transcribe authorized audio
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          AUDIO_URL: ${{ inputs.audio_url }}
          TITLE: ${{ inputs.title }}
        run: |
          python scripts/transcribe_authorized_audio.py \
            --article-url "$ARTICLE_URL" \
            --audio-url "$AUDIO_URL" \
            --title "$TITLE" \
            --rights-confirmed
      - name: Publish transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          if ! git diff --cached --quiet; then
            git commit -m "Publish authorized audio transcript"
            git push
          fi
