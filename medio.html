<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111317"><title>Medio · El Observatorio</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111317;color:#f2f0eb}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input{font:inherit}header{border-bottom:1px solid #373a42;padding:18px 0}.wrap{max-width:1160px;margin:auto;padding:0 18px}.back{color:#cbb48c}h1{font:normal clamp(32px,6vw,54px)/1.1 Georgia,serif;margin:28px 0 12px}.intro{color:#aeb6c1;font-size:13px;line-height:1.6}.tag{display:inline-block;color:var(--t,#aaa);border:1px solid var(--t,#aaa);border-radius:7px;padding:7px 10px;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0}input{min-width:0;flex:1;max-width:360px;background:#22262e;border:1px solid #505760;border-radius:8px;color:#eee;padding:12px;font-size:16px}button{background:#292f38;border:1px solid #505760;color:#eee;border-radius:8px;padding:11px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:70px}.card{background:#1c2027;border:1px solid #353b45;border-radius:12px;overflow:hidden}.card:hover{border-color:var(--t,#aaa)}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.body{padding:15px}.source{font-size:11px;font-weight:750;color:var(--t,#aaa)}h2{font:normal 20px/1.25 Georgia,serif;margin:10px 0}.description{font-size:13px;color:#b6bcc6;line-height:1.5}.date{font-size:11px;color:#949ba6}.status{font-size:12px;color:#adb4bf;margin:12px 0 18px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid{grid-template-columns:1fr;gap:14px}.wrap{padding:0 15px}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none;width:100%;flex-basis:100%}}</style></head><body><header><div class="wrap"><a class="back" href="./">← Volver a El Observatorio</a></div></header><main class="wrap"><h1 id="heading">Noticias del medio</h1><div id="bias" class="tag"></div><p class="intro">La etiqueta describe la línea editorial orientativa del medio, no necesariamente la opinión expresada en cada artículo.</p><div class="toolbar"><input id="search" placeholder="Buscar en este medio…" aria-label="Buscar noticias"><button id="refresh">↻ Actualizar</button></div><div class="status" id="status">Cargando noticias…</div><div class="grid" id="grid"></div></main><script>
const map={'BBC News Mundo':['Sin clasificación','#9199a4'],'La Vanguardia':['Centro','#b7b49d'],'elDiario.es':['Izquierda','#cd8191'],'Cadena SER':['Centroizquierda','#dca37e'],'EL PAÍS':['Centroizquierda','#dca37e'],'The New York Times':['Centroizquierda','#dca37e'],'OKDIARIO':['Derecha','#6a9ed2'],'Libertad Digital':['Derecha','#6a9ed2'],'La Gaceta':['Derecha radical','#6059a5'],'Público':['Izquierda','#cd8191'],'El Salto':['Izquierda alternativa','#bc6577'],'Mundo Obrero':['Izquierda comunista','#b43e49']};
const name=new URLSearchParams(location.search).get('nombre'),info=map[name],$=id=>document.getElementById(id);let stories=[];if(info){$('heading').textContent=name;$('bias').textContent=info[0];document.documentElement.style.setProperty('--t',info[1]);document.title=name+' · El Observatorio'}else{$('heading').textContent='Medio no encontrado';$('bias').hidden=true}
function show(){const q=$('search').value.toLocaleLowerCase('es').trim();const subset=stories.filter(x=>((x.title||'')+' '+(x.description||'')).toLocaleLowerCase('es').includes(q));$('grid').replaceChildren();$('status').textContent=subset.length+' noticias';for(const story of subset){const a=document.createElement('a');a.className='card';a.href=story.url;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.className='photo';img.src=story.image?.startsWith('https://')?story.image:'./fallback.svg';img.loading='lazy';img.alt='';img.onerror=()=>{img.onerror=null;img.src='./fallback.svg'};const body=document.createElement('div');body.className='body';const label=document.createElement('span');label.className='source';label.textContent=name+' · '+info[0];const h=document.createElement('h2');h.textContent=story.title;const p=document.createElement('p');p.className='description';p.textContent=story.description||'Ver noticia en el periódico';const time=document.createElement('div');time.className='date';if(story.date){const t=Date.parse(story.date);if(Number.isFinite(t))time.textContent=new Date(t).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}body.append(label,h,p,time);a.append(img,body);$('grid').append(a)}}
async function load(){if(!info)return;$('status').textContent='Actualizando…';try{const url=new URL('./news.json',location.href);url.searchParams.set('t',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();stories=data.categories?.[name]||[];stories.sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0));show()}catch(err){$('status').textContent='Error al cargar noticias. Pulsa Actualizar.';console.error(err)}}
$('refresh').onclick=load;$('search').addEventListener('input',show);load();setInterval(()=>{if(!document.hidden)load()},300000);
</script></body></html>
